name: Prototype CI

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check and tests
        run: |
          npm run typecheck
          npm run test
      - name: Production build
        run: npm run build
      - name: Package source snapshot
        run: git archive --format=zip --output=fgame-source.zip HEAD
      - name: Upload runnable web build and source
        uses: actions/upload-artifact@v4
        with:
          name: fgame-v0.1-preview-and-source
          path: |
            dist/
            fgame-source.zip
          if-no-files-found: error
          retention-days: 14
