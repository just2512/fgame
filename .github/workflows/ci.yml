name: Prototype CI

on:
  push:
    branches: ["work/save-protection-v0.1"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check and unit tests
        run: |
          mkdir -p artifacts
          npm run typecheck
          npm run test -- --reporter=json --outputFile=artifacts/vitest-results.json
      - name: Production build
        run: npm run build
      - name: Install Chromium for browser acceptance
        run: npx playwright install --with-deps chromium
      - name: Real browser save and offline acceptance
        run: npm run test:e2e
      - name: Upload browser test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fgame-playwright-diagnostics-${{ github.run_id }}
          path: |
            test-results/
            artifacts/playwright-results.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Package source, web preview and build metadata
        run: npm run pack
      - name: Upload reproducible deliverables
        uses: actions/upload-artifact@v4
        with:
          name: fgame-v0.1-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
